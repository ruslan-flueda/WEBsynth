<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="WEBsynth V2 — инструмент для живого электронного перформанса.">
    <title>WEBsynth</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/instrument.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/world.css">

    <!-- Ordered classic scripts also support direct file:// opening. -->
    <script defer src="js/config.js"></script>
    <script defer src="js/music/events.js"></script>
    <script defer src="js/music/patterns/drums.js"></script>
    <script defer src="js/music/patterns/percussion.js"></script>
    <script defer src="js/music/patterns/bass.js"></script>
    <script defer src="js/music/patterns/melody.js"></script>
    <script defer src="js/music/patterns/chords.js"></script>
    <script defer src="js/music/patterns/winds.js"></script>
    <script defer src="js/music/patterns/bells.js"></script>
    <script defer src="js/audio/effects.js"></script>
    <script defer src="js/audio/channel.js"></script>
    <script defer src="js/audio/synthesis.js"></script>
    <script defer src="js/audio/voices.js"></script>
    <script defer src="js/audio/engine.js"></script>
    <script defer src="js/sequencer/sequencer.js"></script>
    <script defer src="js/ui/channel-view.js"></script>
    <script defer src="js/ui/app.js"></script>
    <script defer src="js/visual/pixel-font.js"></script>
    <script defer src="js/visual/world-state.js"></script>
    <script defer src="js/visual/ascii-world.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <canvas id="ascii-world" aria-hidden="true"></canvas>
    <main class="stage">
      <div id="tempo-presets" class="tempo-presets" role="group" aria-label="Темп в BPM"></div>
      <button id="transport" class="transport" type="button" aria-label="Начать воспроизведение" aria-pressed="false">
        <img src="assets/images/figma-play.svg" alt="" width="71" height="50">
        <span class="stop-icon" aria-hidden="true">■</span>
      </button>
      <section id="channels" class="channels" aria-label="Музыкальные каналы"></section>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
